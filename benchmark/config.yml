# logitly calibration benchmark.
#
#   uv run benchmark/run.py
#
# Everything the run depends on is here; nothing is hardcoded in the scripts.
# Paths are relative to this file.

output_dir: results

experiment:
  test_size: 1000        # examples the metrics are measured on (per dataset override below)
  calib_pool: 512        # scored once per model; every calibration set is drawn from it
  calib_sizes: [8, 16, 32, 64, 256]
  seeds: [0, 1, 2, 3, 4] # each one redraws the calibration set; tables report mean ± std
  data_seed: 0           # fixes the test set and the pool, so models see identical data
  balanced_calibration: false  # true = equal examples per class instead of the natural mix
  n_bins: 15             # ECE and reliability bins
  fit:                   # logitly.FitConfig
    learning_rate: 0.05
    max_iters: 500
    prior: 1.0           # holds T back on tiny calibration sets
    fit_bias: true       # false gives plain temperature scaling

# ---------------------------------------------------------------- models ----
# kind: huggingface  -> local weights; `load` goes to HuggingFaceBackend.from_pretrained
# kind: api          -> any OpenAI-compatible server (vLLM, OpenAI, ...)

models:
  qwen3.5-2b:
    kind: huggingface
    model: Qwen/Qwen3.5-2B       # non-thinking by default, so the answer comes first
    load: { batch_size: 16 }

  # vllm:
  #   kind: api
  #   model: Qwen/Qwen2.5-7B-Instruct
  #   base_url: http://localhost:8000/v1
  #   api_key_env: VLLM_API_KEY
  #   api: { concurrency: 16, top_logprobs: 20 }

# -------------------------------------------------------------- datasets ----
# `options` is indexed by the dataset's own label id, so order is not cosmetic.

datasets:
  sst2:
    path: stanfordnlp/sst2
    text_field: sentence
    test_split: validation      # the real test split is unlabelled
    test_size: 800              # that split holds 872 examples
    options: [negative, positive]
    instructions: Is this movie review positive or negative?
    context: You label movie reviews by sentiment.

  ag_news:
    path: fancyzhx/ag_news
    options: [world, sports, business, science and technology]
    instructions: Which section of the newspaper does this story belong to?
    context: You file news stories into sections.

  trec:
    path: CogComp/trec
    load_kwargs: { revision: refs/convert/parquet }  # the default branch still ships a loader script
    label_field: coarse_label
    test_size: 500              # the whole test split
    options: [abbreviation, entity, description, person, location, number]
    instructions: What kind of answer does this question ask for?
    context: You label open-domain questions by the type of answer they expect.

  emotion:
    path: dair-ai/emotion
    config: split
    options: [sadness, joy, love, anger, fear, surprise]
    instructions: Which emotion does this message express?
    context: You label short social-media messages by emotion.

# ---------------------------------------------------------------- report ----

report:
  curve_metrics: [accuracy, nll, ece, brier]
  reliability: true
  dpi: 150

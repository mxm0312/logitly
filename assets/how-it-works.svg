<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 470" width="1240" role="img"
     aria-label="A Hugging Face model runs once inside logitly; only the logits of the option tokens A, B and C are read, calibrated with p = softmax((z - b) / T), and returned as probabilities.">
  <title>How logitly turns one forward pass into calibrated probabilities</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#8a97ab"/>
    </marker>
  </defs>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="12" y="12" width="1216" height="446" rx="20" fill="#f7fafe" stroke="#cfd8e6" stroke-width="1.5"/>
    <rect x="40" y="34" width="78" height="27" rx="13.5" fill="#2f6df6"/>
    <text x="79" y="52.5" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">logitly</text>
    <text x="132" y="53" font-size="13" fill="#6b7686">the model runs once — everything after that is arithmetic</text>

    <!-- the model -->
    <rect x="44" y="196" width="224" height="132" rx="14" fill="#ffffff" stroke="#cfd8e6" stroke-width="1.5"/>
    <text x="80" y="241" font-size="26" text-anchor="middle">🤗</text>
    <text x="102" y="238" font-size="16" font-weight="600" fill="#172033">Qwen3.5-2B</text>
    <text x="68" y="267" font-size="11.5" fill="#6b7686">any Hugging Face causal LM</text>
    <line x1="68" y1="285" x2="244" y2="285" stroke="#eef2f8" stroke-width="1.5"/>
    <text x="68" y="306" font-size="12" font-weight="600" fill="#2f6df6">one forward pass</text>
    <line x1="274" y1="262" x2="320" y2="262" stroke="#8a97ab" stroke-width="1.6" marker-end="url(#a)"/>

    <!-- the logit vector -->
    <text x="392" y="98" font-size="13" font-weight="600" fill="#172033" text-anchor="middle">logits z</text>
    <text x="392" y="116" font-size="12" fill="#6b7686" text-anchor="middle">one value per vocabulary token</text>
    <path d="M346 128 L336 128 L336 404 L346 404" fill="none" stroke="#8a97ab" stroke-width="1.8"/>
    <path d="M438 128 L448 128 L448 404 L438 404" fill="none" stroke="#8a97ab" stroke-width="1.8"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" text-anchor="middle">
      <text x="392" y="139" fill="#a3aec0">3.1</text>
      <circle cx="392" cy="159" r="1.7" fill="#c3ccda"/><circle cx="392" cy="166" r="1.7" fill="#c3ccda"/><circle cx="392" cy="173" r="1.7" fill="#c3ccda"/>
      <text x="392" y="235" fill="#a3aec0">7.9</text>
      <text x="392" y="299" fill="#a3aec0">5.2</text>
      <circle cx="392" cy="351" r="1.7" fill="#c3ccda"/><circle cx="392" cy="358" r="1.7" fill="#c3ccda"/><circle cx="392" cy="365" r="1.7" fill="#c3ccda"/>
      <text x="392" y="395" fill="#a3aec0">6.7</text>

      <rect x="344" y="183" width="96" height="30" rx="9" fill="#e9f0ff" stroke="#2f6df6" stroke-width="1.3"/>
      <rect x="344" y="247" width="96" height="30" rx="9" fill="#e9f0ff" stroke="#2f6df6" stroke-width="1.3"/>
      <rect x="344" y="311" width="96" height="30" rx="9" fill="#e9f0ff" stroke="#2f6df6" stroke-width="1.3"/>
      <text x="392" y="203" fill="#172033" font-weight="600">24.8</text>
      <text x="392" y="267" fill="#172033" font-weight="600">26.8</text>
      <text x="392" y="331" fill="#172033" font-weight="600">28.0</text>
    </g>
    <text x="392" y="430" font-size="11.5" fill="#93a0b4" text-anchor="middle">only the three option rows are read</text>

    <!-- what those rows are -->
    <g>
      <line x1="448" y1="198" x2="474" y2="198" stroke="#c9d2e0" stroke-width="1.4"/>
      <line x1="448" y1="262" x2="474" y2="262" stroke="#c9d2e0" stroke-width="1.4"/>
      <line x1="448" y1="326" x2="474" y2="326" stroke="#c9d2e0" stroke-width="1.4"/>
      <circle cx="488" cy="198" r="12" fill="#2f6df6"/>
      <circle cx="488" cy="262" r="12" fill="#2f6df6"/>
      <circle cx="488" cy="326" r="12" fill="#2f6df6"/>
      <g font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">
        <text x="488" y="202">A</text>
        <text x="488" y="266">B</text>
        <text x="488" y="330">C</text>
      </g>
      <g font-size="13.5" fill="#172033">
        <text x="508" y="203">calm</text>
        <text x="508" y="267">frustrated</text>
        <text x="508" y="331">angry</text>
      </g>
    </g>

    <path d="M586 190 q10 0 10 10 v52 q0 10 10 10 q-10 0 -10 10 v52 q0 10 -10 10"
          fill="none" stroke="#b9c6da" stroke-width="1.6"/>
    <line x1="612" y1="262" x2="660" y2="262" stroke="#8a97ab" stroke-width="1.6" marker-end="url(#a)"/>

    <!-- the calibration -->
    <rect x="666" y="186" width="246" height="152" rx="14" fill="#ffffff" stroke="#2f6df6" stroke-width="1.6"/>
    <text x="690" y="218" font-size="14" font-weight="600" fill="#2f6df6">calibration</text>
    <text x="789" y="262" font-size="14.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          fill="#172033" text-anchor="middle">p = softmax((z − b) / T)</text>
    <text x="690" y="296" font-size="11.5" fill="#6b7686">T rescales confidence, b removes</text>
    <text x="690" y="314" font-size="11.5" fill="#6b7686">a standing preference for an option</text>
    <line x1="916" y1="262" x2="964" y2="262" stroke="#8a97ab" stroke-width="1.6" marker-end="url(#a)"/>

    <!-- the answer -->
    <text x="972" y="172" font-size="13" font-weight="600" fill="#172033">calibrated probabilities</text>
    <text x="972" y="190" font-size="11.5" fill="#6b7686">over exactly the options you declared</text>
    <g font-size="12.5">
      <text x="1044" y="227" fill="#6b7686" text-anchor="end">calm</text>
      <text x="1044" y="267" fill="#6b7686" text-anchor="end">frustrated</text>
      <text x="1044" y="307" fill="#172033" font-weight="600" text-anchor="end">angry</text>
      <rect x="1054" y="213" width="120" height="18" rx="5" fill="#eef2f8"/>
      <rect x="1054" y="253" width="120" height="18" rx="5" fill="#eef2f8"/>
      <rect x="1054" y="293" width="120" height="18" rx="5" fill="#eef2f8"/>
      <rect x="1054" y="213" width="4" height="18" rx="2" fill="#b8cdf8"/>
      <rect x="1054" y="253" width="27" height="18" rx="5" fill="#b8cdf8"/>
      <rect x="1054" y="293" width="89" height="18" rx="5" fill="#2f6df6"/>
      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#172033">
        <text x="1184" y="227" fill="#6b7686">0.03</text>
        <text x="1184" y="267" fill="#6b7686">0.22</text>
        <text x="1184" y="307" font-weight="600">0.75</text>
      </g>
    </g>
    <text x="972" y="352" font-size="11.5" fill="#93a0b4">they sum to 1 and mean what they say</text>
  </g>
</svg>
